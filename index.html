<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: draw under the notch; the HUD pads itself with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0908" />

    <!-- Home-screen app: the only way to get full screen on iPhone (Safari has no
         Fullscreen API for pages); Android also opens it without browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snooker" />
    <title>3D Snooker</title>
    <meta name="description" content="Full-size 3D snooker in the browser: WPBSA table, custom physics and a CPU opponent with three levels. Plays on desktop and mobile." />

    <!-- Social sharing (LinkedIn, Facebook, X, Slack…). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://snooker.gacikdesign.com/" />
    <meta property="og:title" content="3D Snooker" />
    <meta property="og:description" content="Full-size 3D snooker in the browser: WPBSA table, custom physics and a CPU opponent with three levels." />
    <meta property="og:image" content="https://snooker.gacikdesign.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="3D Snooker start screen: cue aimed at the red pack on a green table" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="3D Snooker" />
    <meta name="twitter:description" content="Full-size 3D snooker in the browser: WPBSA table, custom physics and a CPU opponent with three levels." />
    <meta name="twitter:image" content="https://snooker.gacikdesign.com/og-image.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
